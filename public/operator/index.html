<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Webhook Operator</title>
  <style>
    :root{color-scheme:light;--ink:#17211b;--muted:#68746c;--paper:#f5f7f4;--card:#fff;--line:#dce5dd;--green:#176b4d;--red:#a83b3b;--amber:#9a6b16}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:0 auto;padding:28px 18px 56px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:0}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--muted);margin:4px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #183d2c0b;padding:18px;margin-bottom:16px}.auth{display:flex;gap:10px;align-items:center;max-width:680px}input,select,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:9px 11px}input{flex:1;min-width:0}button{background:var(--green);border-color:var(--green);color:white;cursor:pointer;font-weight:650}button.secondary{background:white;color:var(--green)}button:disabled{opacity:.5;cursor:wait}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:25px;letter-spacing:-.04em}.metric span{color:var(--muted);font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.toolbar select{min-width:140px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.pill{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}.received{background:#fff3d5;color:var(--amber)}.processed{background:#dcf3e6;color:var(--green)}.failed{background:#fde3e3;color:var(--red)}.ignored{background:#e9edf0;color:#59636a}.error{color:var(--red);min-height:22px}.empty{color:var(--muted);padding:18px 0}.muted{color:var(--muted);font-size:13px}@media(max-width:600px){main{padding:20px 12px}.auth{align-items:stretch;flex-direction:column}header{display:block}.auth input{width:100%}.card{padding:14px}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Webhook operator</h1><p class="sub">Inbox health, delivery state and safe replay.</p></div><button class="secondary" id="refresh">Refresh</button></header>
  <section class="card"><h2>Operator access</h2><div class="auth"><input id="key" type="password" placeholder="OPERATOR_API_KEY" autocomplete="off"><button id="connect">Connect</button></div><p class="muted">The key stays in this browser tab and is sent only to this service.</p><div class="error" id="error"></div></section>
  <section class="card"><h2>Metrics</h2><div class="metrics" id="metrics"><div class="empty">Connect to load metrics.</div></div></section>
  <section class="card"><div class="toolbar"><h2 style="margin-right:auto">Events</h2><select id="status"><option value="">All statuses</option><option value="received">Received</option><option value="processed">Processed</option><option value="failed">Failed</option><option value="ignored">Ignored</option></select><input id="type" placeholder="Event type"><button id="load">Load events</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Provider / type</th><th>Status</th><th>Attempts</th><th>Received</th><th>Action</th></tr></thead><tbody id="events"><tr><td colspan="6" class="empty">Connect to load events.</td></tr></tbody></table></div></section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id); let key = sessionStorage.getItem('operatorKey') || '';
  $('key').value = key;
  const showError = (message='') => $('error').textContent = message;
  const request = async (path, options={}) => { const response = await fetch(path, { ...options, headers: { 'x-operator-key': key, ...(options.headers || {}) } }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.error?.message || `Request failed (${response.status})`); return body; };
  const metric = (label, value) => `<div class="metric"><b>${value ?? '—'}</b><span>${label}</span></div>`;
  const renderMetrics = (data) => { const status = data.byStatus || {}; $('metrics').innerHTML = [metric('Total events',data.totalEvents),metric('Processed',data.processedEvents),metric('Pending',data.pendingEvents),metric('Failed',data.failedEvents),metric('Retries',data.retries),metric('Avg latency',data.averageProcessingLatencyMs === null ? '—' : `${data.averageProcessingLatencyMs} ms`)].join(''); };
  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const renderEvents = (rows) => { $('events').innerHTML = rows.length ? rows.map((event) => `<tr><td>#${esc(event.id)}</td><td><strong>${esc(event.provider)}</strong><br><span class="muted">${esc(event.eventType)}</span></td><td><span class="pill ${esc(event.status)}">${esc(event.status)}</span>${event.lastError ? `<br><span class="muted">${esc(event.lastError)}</span>` : ''}</td><td>${esc(event.attempts)}</td><td>${esc(new Date(event.createdAt).toLocaleString())}</td><td>${event.status === 'failed' ? `<button data-replay="${esc(event.id)}">Replay</button>` : '<span class="muted">—</span>'}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No events match the filters.</td></tr>'; };
  const load = async () => { if (!key) return showError('Enter the operator API key first.'); showError(''); $('load').disabled = true; try { const params = new URLSearchParams({ per_page:'50' }); if ($('status').value) params.set('status',$('status').value); if ($('type').value.trim()) params.set('type',$('type').value.trim()); const [metrics, events] = await Promise.all([request('/ops/metrics'), request(`/ops/events?${params}`)]); renderMetrics(metrics.data); renderEvents(events.data); } catch (error) { showError(error.message); } finally { $('load').disabled = false; } };
  $('connect').onclick = () => { key = $('key').value.trim(); sessionStorage.setItem('operatorKey', key); load(); }; $('refresh').onclick = load; $('load').onclick = load;
  $('events').onclick = async (event) => { const button = event.target.closest('[data-replay]'); if (!button) return; button.disabled = true; try { await request(`/ops/events/${button.dataset.replay}/replay`, { method:'POST' }); await load(); } catch (error) { showError(error.message); button.disabled = false; } };
  if (key) load();
})();
</script>
</body>
</html>
